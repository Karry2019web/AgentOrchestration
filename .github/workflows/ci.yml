name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --cov=src tests/
      - name: Lint
        run: uv run flake8 src/ tests/

  docker-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        run: |
          docker build -t ao-runtime -f infra/Dockerfile .
      - name: Verify no package manager caches
        run: |
          echo "Checking for package manager cache directories..."
          ! docker run --rm ao-runtime sh -c "test -d /var/lib/apt/lists && echo 'FOUND: apt lists' && exit 1 || true"
          ! docker run --rm ao-runtime sh -c "test -d /root/.cache && echo 'FOUND: pip cache' && exit 1 || true"
          ! docker run --rm ao-runtime sh -c "test -d /var/cache/apt && echo 'FOUND: apt cache' && exit 1 || true"
          echo "✓ No package manager caches found in runtime image"
      - name: Report image size
        run: |
          echo "Runtime image size: \$(docker images --format "{{.Size}}" ao-runtime)"
