name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --cov=src tests/
      - name: Lint
        run: uv run flake8 src/ tests/

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [scheduler, executor, sidecar]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.image }} image
        run: |
          docker build --target ${{ matrix.image }} \
            -t agent-orchestrator:${{ matrix.image }}:${{ github.sha }} \
            -f Dockerfile .
      - name: Scan ${{ matrix.image }} with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: agent-orchestrator:${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
      - name: Record scan digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            agent-orchestrator:${{ matrix.image }}:${{ github.sha }} 2>/dev/null || echo "no-digest")
          echo "SCANNED_IMAGE=${{ matrix.image }}@$DIGEST" >> $GITHUB_ENV
      - name: Fail on unsupported image name
        run: |
          case "${{ matrix.image }}" in
            scheduler|executor|sidecar) ;;
            *)
              echo "Unknown image: ${{ matrix.image }}"
              exit 1
              ;;
          esac
