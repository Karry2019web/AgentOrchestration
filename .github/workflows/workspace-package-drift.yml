name: Workspace Package Drift Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-package-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate workspace package version drift
        run: |
          python scripts/validate_package_drift.py --ci --compare-branch origin/main
