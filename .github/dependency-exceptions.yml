# Dependency Review Exception Manifest
#
# Each entry records an approved override for a dependency review failure.
# Expired exceptions cause CI to fail until removed or renewed.
#
# Fields:
#   dependency:  Package name and version (e.g. "lodash@4.17.20")
#   owner:       GitHub username of the person authorizing the exception
#   reason:      Short explanation why the exception is granted
#   expires:     ISO 8601 date after which the exception is invalid
#   created:     ISO 8601 date when the exception was recorded

exceptions:
