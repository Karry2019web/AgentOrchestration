version: "3.8"

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://ao:ao@postgres:5432/ao
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ao
      POSTGRES_PASSWORD: ao
      POSTGRES_DB: ao
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ao"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
